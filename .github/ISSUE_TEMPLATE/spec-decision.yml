name: Spec or architecture decision
description: Propose a change to the Agent Trail format, schema, validation semantics, package layout, or durable architecture.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Use this before changing load-bearing shape such as schema semantics, validation terminology, hash semantics, artifact identity, package layout, or public URL shape.
  - type: textarea
    id: problem
    attributes:
      label: Problem or decision
      description: What decision needs to be made, and why now?
    validations:
      required: true
  - type: textarea
    id: affected-surface
    attributes:
      label: Affected contract surface
      description: Name the spec section, schema records/properties, package APIs, CLI behavior, docs, ADRs, or public URLs affected.
      placeholder: spec.md section, schema.json path, package API, ADR number, etc.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: List the plausible options and the tradeoff for each.
      placeholder: |
        - Option A:
        - Option B:
        - Option C:
    validations:
      required: true
  - type: textarea
    id: proposed-rule
    attributes:
      label: Proposed rule
      description: State the exact rule or decision to implement.
    validations:
      required: true
  - type: textarea
    id: compatibility-risk
    attributes:
      label: Compatibility risk
      description: Describe whether this affects existing trail files, readers, writers, package consumers, URLs, or docs.
    validations:
      required: true
  - type: textarea
    id: docs-adr-impact
    attributes:
      label: Required docs or ADR updates
      description: List docs, ADRs, schema/type generation, fixtures, or tests that must change with the decision.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
