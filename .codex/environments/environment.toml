version = 1
name = "agent-trail"

[setup]
script = "bun install --frozen-lockfile --ignore-scripts && bun run worktree:setup"

[[actions]]
name = "Check"
icon = "check"
command = "bun run check"

[[actions]]
name = "Typecheck"
icon = "wrench"
command = "bun run typecheck"

[[actions]]
name = "Test"
icon = "beaker"
command = "bun run test"

[[actions]]
name = "Lint"
icon = "search"
command = "bun run lint"

[[actions]]
name = "Schema"
icon = "file-json"
command = "bun run check:schema && bun run check:types && bun run check:source-types"

[[actions]]
name = "Worktree Doctor"
icon = "stethoscope"
command = "bun run worktree:doctor"
